services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_TEST_DB:-nba_test}
      POSTGRES_USER: ${POSTGRES_TEST_USER:-nba_test}
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD:-nba_test_local_only}
    ports:
      - "127.0.0.1:${POSTGRES_TEST_PORT:-55432}:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 2s
      timeout: 3s
      retries: 15
    tmpfs:
      - /var/lib/postgresql/data
    restart: "no"
